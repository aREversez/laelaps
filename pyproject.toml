[project]
name = "language-tools"
version = "0.1.0"
description = "Bilingual document -> translation-memory corpus conversion (docx/xlsx/csv -> sdltm/tmx, plus corpus interconversion)"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["language_tools*"]
