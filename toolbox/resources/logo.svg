<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <rect x="0" y="0" width="40" height="40" rx="9" fill="#2E4374"/>
  <!-- faint vertical alignment guides, not diagonal connectors -->
  <line x1="12" y1="15" x2="12" y2="25" stroke="#FFFFFF" stroke-width="1" opacity="0.28"/>
  <line x1="28" y1="15" x2="28" y2="25" stroke="#FFFFFF" stroke-width="1" opacity="0.28"/>
  <!-- source segments (top row): three bars of differing length -->
  <rect x="7" y="12" width="9" height="3" rx="1.5" fill="#FFFFFF"/>
  <rect x="18" y="12" width="5" height="3" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="25" y="12" width="8" height="3" rx="1.5" fill="#FFFFFF"/>
  <!-- target segments (bottom row): two bars, first spans the width of the first two source bars (2:1 grouping) -->
  <rect x="7" y="25" width="16" height="3" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="25" y="25" width="8" height="3" rx="1.5" fill="#FFFFFF"/>
</svg>
